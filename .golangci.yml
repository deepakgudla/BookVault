version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    # - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gocritic
    - revive

  settings:
    errcheck:
      check-type-assertions: true

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style

    revive:
      rules:
        - name: exported

  exclusions:
    rules:
      - path: graph/resolver/
        linters:
          - gocritic
      - text: "SA1019"
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports